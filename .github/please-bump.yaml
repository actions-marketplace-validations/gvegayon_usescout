version: 1

defaults:
  unchanged-policy: release   # bump once after each release, not on every PR

waiver:
  labels: [no-version-bump]
  marker: true

groups:
  usescout:
    # only changes that alter what ships need a bump; docs, tests and CI do not
    paths: |
      src/
      pyproject.toml
      Dockerfile
      action.yml
    consistency: identical     # pyproject.toml and __init__.py must carry the same version
    rules:
      - preset: python-pyproject
        files: [pyproject.toml]
      - preset: python-dunder
        files: [src/usescout/__init__.py]
      - scheme: pep440            # the image action.yml runs must be the one released for this version
        files: [action.yml]
        parts:
          version: '^[[:space:]]*image:[[:space:]]*docker://ghcr\.io/gvegayon/usescout:v([0-9][^[:space:]]*)[[:space:]]*$'
